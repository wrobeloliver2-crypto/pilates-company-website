<title>Seite nicht gefunden – Pilates Company Lübeck</title>
<script>
// 19.10.2026: WhatsApp-Links zur Infoseite gingen vom 18.10. an ohne „?" raus:
//   /alle-infos-besuch-probetraining.htmlr=boutique&k=Basic-Reformer&z=…
// Ab hier richtig weiterleiten, damit die schon verschickten Nachrichten funktionieren.
(function () {
  var basis = '/alle-infos-besuch-probetraining.html';
  var p = location.pathname;
  if (p.indexOf(basis) === 0 && p.length > basis.length) {
    var rest = p.slice(basis.length).replace(/^(%3F|\?)/i, '');
    location.replace(basis + '?' + rest + (location.search ? '&' + location.search.slice(1) : ''));
  }
})();
</script>
